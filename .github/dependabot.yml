version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Angular, Tailwind, Jasmine, etc.: los saltos mayores se hacen a mano (ng update)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
